<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="falcon.ron">
<meta name="description" content="falcon.ron — Web3 social + wallet + AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>falcon.ron</title>
<style>
:root{--obs:#0B0B0F;--char:#121212;--gold:#D4AF37;--plat:#E5E4E2;--cyan:#00F0FF;--line:rgba(229,228,226,.14);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:#050507;color:var(--plat);font-family:Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{padding:16px;max-width:1280px;margin:0 auto}
h1,h2,.d{font-family:"SF Pro Display",Inter,system-ui,sans-serif;font-weight:700}
h1{color:var(--gold);font-size:clamp(26px,6vw,44px);letter-spacing:.02em;line-height:1.1}
.lead{color:rgba(229,228,226,.7);margin:8px 0 22px;font-size:15px;line-height:1.6;max-width:70ch}
h2{font-size:18px;color:var(--gold);margin:36px 0 14px}
.glass{background:rgba(18,18,18,.8);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(10px)}
.brand{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.span2{grid-column:1/-1}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.sw div{border-radius:12px;border:1px solid var(--line);padding:12px;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;direction:ltr;text-align:left;line-height:1.4}
.sw b{font-size:14px}
.scale{direction:ltr;text-align:left;display:grid;gap:6px}
.scale .a{font-size:34px;color:var(--gold)}.scale .b{font-size:20px}.scale .c{font-size:14px;color:rgba(229,228,226,.75)}
.btns{display:flex;gap:10px;flex-wrap:wrap;direction:ltr}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--gold);background:var(--gold);color:var(--obs);cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--gold)}
.btn.c{background:transparent;color:var(--cyan);border-color:var(--cyan)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:13px;line-height:1.5;color:rgba(229,228,226,.8)}
.apps b{display:block;color:var(--plat)}
.phones{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;direction:ltr}
.cap{text-align:center;font-size:12px;color:rgba(229,228,226,.65);margin-top:8px;direction:rtl}
.phone{width:270px;height:560px;border-radius:36px;border:2px solid var(--gold);background:var(--obs);padding:9px;position:relative;box-shadow:0 0 0 5px #0f0f13,0 18px 40px rgba(0,0,0,.55);flex-shrink:0}
.scr{height:100%;border-radius:28px;overflow:hidden;background:radial-gradient(120% 50% at 80% 0%,rgba(212,175,55,.12),transparent 60%),var(--obs);display:flex;flex-direction:column;position:relative}
.scr::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(229,228,226,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(229,228,226,.025) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.scr>*{position:relative}
.sb{display:flex;justify-content:space-between;padding:9px 16px 3px;font-size:11px}
.pad{padding:6px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#7a5f12);display:grid;place-items:center;color:var(--obs);font-weight:700;font-size:12px;flex-shrink:0}
.hi{font-size:11px;color:rgba(229,228,226,.6)}
.nm{font-size:14px;font-weight:700}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-left:4px}
.bal{border:1px solid rgba(212,175,55,.55);border-radius:16px;padding:12px;background:linear-gradient(145deg,rgba(212,175,55,.16),rgba(18,18,18,.7))}
.bal .n{font-size:24px;font-weight:700;color:var(--gold);margin:3px 0 2px}
.chg{font-size:11px;color:var(--cyan)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.qa div{background:rgba(18,18,18,.85);border:1px solid var(--line);border-radius:11px;padding:9px 0;text-align:center;font-size:10px}
.ic{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
.card{background:rgba(18,18,18,.85);border:1px solid var(--line);border-radius:13px;padding:9px;font-size:12px;line-height:1.45}
.lab{font-size:10px;color:rgba(229,228,226,.55)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px 12px;border-top:1px solid var(--line);background:rgba(11,11,15,.92);font-size:9px;text-align:center}
.nav .on{color:var(--gold)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--char);border:1px solid var(--line);border-radius:11px;padding:3px;font-size:12px;text-align:center}
.seg div{padding:7px;border-radius:8px}
.seg .on{background:var(--gold);color:var(--obs);font-weight:700}
.coin{display:flex;align-items:center;gap:9px;padding:9px;border-bottom:1px solid var(--line);font-size:12px}
.coin .l{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;border:1.4px solid var(--gold);color:var(--gold)}
.coin .r{margin-left:auto;text-align:right}
.fp{width:84px;height:84px;border-radius:50%;border:2px solid var(--cyan);margin:10px auto;display:grid;place-items:center;box-shadow:0 0 22px rgba(0,240,255,.3)}
.fp svg{width:42px;height:42px;stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round}
.msg{max-width:84%;padding:8px 10px;border-radius:13px;font-size:12px;line-height:1.45}
.me{align-self:flex-end;background:var(--gold);color:var(--obs)}
.ai{align-self:flex-start;background:var(--char);border:1px solid rgba(0,240,255,.4)}
.inp{border:1px solid var(--line);border-radius:11px;padding:9px;font-size:12px;color:rgba(229,228,226,.45);background:var(--char)}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.logo-img{width:110px;height:110px;border-radius:26px;border:2px solid var(--gold);box-shadow:0 0 28px rgba(212,175,55,.22);object-fit:cover}
.logo-sm{width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.chat-list{display:flex;flex-direction:column;gap:7px;overflow:auto;flex:1}
.chat-item{display:flex;align-items:center;gap:9px;padding:9px;background:rgba(18,18,18,.7);border:1px solid var(--line);border-radius:11px;font-size:12px}
.chat-item .av{width:36px;height:36px;font-size:13px}
.chat-item .meta{flex:1;min-width:0}
.chat-item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .time{font-size:10px;color:rgba(229,228,226,.45);white-space:nowrap}
.profile-head{text-align:center;padding:6px 0}
.profile-av{width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);margin:0 auto 7px;background:linear-gradient(135deg,var(--gold),#7a5f12);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--obs)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
.stat-row div{background:rgba(18,18,18,.85);border:1px solid var(--line);border-radius:11px;padding:9px 3px}
.stat-row b{display:block;font-size:15px;color:var(--gold)}
.stat-row span{font-size:10px;color:rgba(229,228,226,.55)}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}
.menu-item:last-child{border:0}
.menu-item svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.6}
/* Feed styles */
.feed{display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.story-bar{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.story{width:56px;text-align:center;font-size:9px;flex-shrink:0}
.story img,.story .s-av{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;display:block;margin:0 auto 3px}
.story .s-av{background:linear-gradient(135deg,var(--gold),#5a4a10);display:grid;place-items:center;font-weight:700;color:var(--obs);font-size:14px}
.post{background:rgba(18,18,18,.85);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px}
.post-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post-h img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.post-body{line-height:1.5;margin-bottom:8px}
.post-actions{display:flex;gap:14px;font-size:11px;color:rgba(229,228,226,.55)}
.post-actions span{cursor:pointer}
.svc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.svc-grid img{width:100%;border-radius:12px;aspect-ratio:1;object-fit:cover;border:1px solid var(--line)}
/* Designed apps */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;direction:ltr}
.app-card{background:rgba(18,18,18,.9);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;transition:.2s}
.app-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.app-card img{width:64px;height:64px;border-radius:16px;object-fit:cover;margin-bottom:8px}
.app-card b{display:block;font-size:12px;color:var(--plat)}
/* Live */
.live-section{margin:40px 0 20px;padding:24px;background:rgba(18,18,18,.6);border:1px solid var(--line);border-radius:20px}
.live-section h2{margin-top:0}
.live-wrap{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center}
.live-phone{width:300px;height:620px;border-radius:40px;border:3px solid var(--gold);background:var(--obs);padding:11px;box-shadow:0 0 0 7px #0f0f13,0 25px 60px rgba(0,0,0,.65);position:relative}
.live-scr{height:100%;border-radius:30px;overflow:hidden;background:radial-gradient(120% 50% at 80% 0%,rgba(212,175,55,.12),transparent 60%),var(--obs);display:flex;flex-direction:column;position:relative}
.live-scr::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(229,228,226,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(229,228,226,.025) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;z-index:0}
.live-scr>*{position:relative;z-index:1}
.live-controls{flex:1;min-width:280px;max-width:380px}
.live-controls h3{font-size:16px;color:var(--gold);margin-bottom:10px}
.live-controls p{font-size:13px;color:rgba(229,228,226,.65);line-height:1.55;margin-bottom:14px}
.screen-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.screen-btns button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--char);color:var(--plat);font-size:12px;cursor:pointer;transition:.2s}
.screen-btns button:hover,.screen-btns button.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.12)}

.screen-btns button{position:relative;padding-top:14px}
.badge{position:absolute;top:2px;right:4px;font-size:8px;font-weight:700;padding:1px 4px;border-radius:4px;line-height:1.2}
.badge.mvp{background:rgba(46,204,113,.25);color:#2ecc71}
.badge.p2{background:rgba(241,196,15,.2);color:#f1c40f}
.badge.later{background:rgba(149,165,166,.2);color:#95a5a6}

.hint{font-size:12px;color:rgba(229,228,226,.5);margin-top:12px;line-height:1.5}
#liveApp{display:flex;flex-direction:column;height:100%}
#liveApp .pad{flex:1;overflow-y:auto}
#liveApp .nav button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
#liveApp .nav button.on{color:var(--gold)}
#liveApp .qa div,#liveApp .chat-item,#liveApp .menu-item,#liveApp .btn,#liveApp .post-actions span,#liveApp .story{cursor:pointer;transition:.15s}
#liveApp .qa div:active,#liveApp .chat-item:active{transform:scale(.97);opacity:.85}
.toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--obs);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.show{opacity:1}
.swap-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.swap-box{flex:1;background:var(--char);border:1px solid var(--line);border-radius:12px;padding:10px}
.swap-box .lab{margin-bottom:4px}
.swap-arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:16px;flex-shrink:0}
.file-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);font-size:12px}
.file-item .icon{width:36px;height:36px;border-radius:10px;background:rgba(212,175,55,.15);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.progress{height:4px;background:var(--char);border-radius:4px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:4px}
.zk-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,240,255,.12);border:1px solid rgba(0,240,255,.35);color:var(--cyan);font-size:11px;padding:4px 10px;border-radius:20px}
.court-card{border-left:3px solid var(--gold);padding:10px;margin-bottom:8px;background:rgba(18,18,18,.8);border-radius:0 12px 12px 0}
.court-card.win{border-left-color:#2ecc71}
.court-card.pending{border-left-color:var(--cyan)}
@media (prefers-reduced-motion:no-preference){.dot{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}

.app-ic{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#7a5f12);display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--obs);flex-shrink:0}
.story img,.post-h img,.svc-grid img{display:none}
.story .s-av,.story > div:first-child{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:linear-gradient(135deg,var(--gold),#5a4a10);display:grid;place-items:center;font-weight:700;color:var(--obs);font-size:14px;margin:0 auto 3px}
body{padding:12px;max-width:1100px;margin:0 auto}
.live-section{margin:0;padding:16px}
.live-wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center}
h1{font-size:22px;margin-bottom:4px}
.sub{color:rgba(229,228,226,.55);font-size:13px;margin-bottom:16px}

.svc-grid .s-av{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(0,240,255,.1));display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--gold);margin-bottom:2px}
.row img{display:none}

/* ========== RESPONSIVE WEB APP ========== */
html, body {
  height: 100%;
  overflow: hidden;
  background: #050507;
}
body {
  padding: 0 !important;
  max-width: none !important;
  margin: 0 !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Desktop: centered phone-like frame */
.live-section {
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  border: none !important;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.live-wrap {
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  max-width: 1100px;
}
.live-phone {
  width: 400px;
  height: min(860px, 100dvh - 24px);
  max-height: 100dvh;
  border-radius: 28px;
  border: 2px solid var(--gold);
  background: var(--obs);
  padding: 0;
  box-shadow: 0 0 0 6px #0a0a0e, 0 25px 60px rgba(0,0,0,.7);
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
}
.live-scr {
  height: 100%;
  border-radius: 26px;
  overflow: hidden;
  background: radial-gradient(120% 50% at 80% 0%,rgba(212,175,55,.12),transparent 60%), var(--obs);
  display: flex;
  flex-direction: column;
  position: relative;
}
#liveApp {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  overflow: hidden;
}
#liveApp .pad {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}
/* Fixed bottom nav inside the app */
#liveApp .nav {
  flex-shrink: 0;
  position: sticky;
  bottom: 0;
  z-index: 10;
  background: rgba(11,11,15,.96);
  backdrop-filter: blur(12px);
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}

/* Hide prototype chrome on all sizes by default for cleaner app feel; show controls only on very wide */
h1, .sub {
  display: none;
}
.live-controls {
  display: none;
}

@media (min-width: 1100px) {
  .live-controls {
    display: block;
    flex: 1;
    min-width: 280px;
    max-width: 380px;
    max-height: 90vh;
    overflow-y: auto;
  }
}

/* ========== MOBILE: full-screen app ========== */
@media (max-width: 767px) {
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--obs);
  }
  body {
    padding: 0 !important;
    margin: 0 !important;
  }
  h1, .sub, .live-controls {
    display: none !important;
  }
  .live-section, .live-wrap {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
  }
  .live-phone {
    width: 100vw !important;
    height: 100% !important;
    height: 100dvh !important;
    max-height: none !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
  .live-scr {
    border-radius: 0 !important;
    height: 100%;
  }
  #liveApp {
    height: 100%;
    height: 100dvh;
  }
  #liveApp .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 50;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #liveApp .pad {
    padding-bottom: 70px; /* space for fixed nav */
  }
  .toast {
    bottom: 80px !important;
  }
}
</style>

};

function go(name) {
  document.getElementById('liveApp').innerHTML = screens[name];
  document.querySelectorAll('#screenBtns button').forEach(b => {
    b.classList.toggle('active', b.dataset.screen === name);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1700);
}

function liveAction(type) {
  if (type === 'swap') { go('dex'); setTimeout(() => showToast('Swap done · 92.16 TON'), 400); }
  else if (type === 'msg') { go('mron'); setTimeout(() => showToast('Message sent (encrypted)'), 300); }
  else if (type === 'like') { go('home'); setTimeout(() => showToast('Liked 👍'), 200); }
  else if (type === 'aiAsk') {
    const chat = document.getElementById('aiChat');
    if (chat) {
      chat.innerHTML += `<div class="msg me">Portfolio health?</div>`;
      setTimeout(() => {
        chat.innerHTML += `<div class="msg ai">8.4/10 · Healthy allocation. Rebalance?</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 600);
    }
  }
  else if (type === 'chatSend') {
    const box = document.getElementById('chatMsgs');
    if (box) {
      box.innerHTML += `<div class="msg me">تمام، شكراً</div>`;
      setTimeout(() => {
        box.innerHTML += `<div class="msg ai">أي وقت. راح أبلغك لما #219 يتحدث.</div>`;
        box.scrollTop = box.scrollHeight;
      }, 700);
      showToast('Message sent (encrypted)');
    }
  }
}

function toggleShield(el) {
  const span = el.querySelector('span:last-child');
  if (span.textContent === 'ON') { span.textContent = 'OFF'; span.style.color = 'rgba(229,228,226,.5)'; }
  else { span.textContent = 'ON'; span.style.color = 'var(--cyan)'; }
  showToast('Updated');
}

const screenBtns = document.getElementById('screenBtns');
if (screenBtns) {
  screenBtns.addEventListener('click', e => {
    if (e.target.dataset.screen) go(e.target.dataset.screen);
  });
}

go('home');

// PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
